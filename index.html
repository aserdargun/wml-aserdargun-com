<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f5f5f0"/><meta name="description" content="Explore observation, belief, prediction and planning in WFM’s interactive laboratory. Compare three hand-coded predictors against a simulated world."/><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/><title>WML - World Model Laboratory</title><link rel="canonical" href="https://wml.aserdargun.com/"/><meta property="og:type" content="website"/><meta property="og:site_name" content="World Model Laboratory"/><meta property="og:title" content="World Model Laboratory"/><meta property="og:description" content="Explore observation, belief, prediction, planning, and counterfactual branches in WFM’s experiment laboratory. Compare three hand-coded predictors against a simulated world; these are not trained foundation models."/><meta property="og:url" content="https://wml.aserdargun.com/"/><meta property="og:locale" content="en_US"/><meta name="twitter:card" content="summary"/><meta name="twitter:title" content="World Model Laboratory"/><meta name="twitter:description" content="Explore observation, belief, prediction, planning, and counterfactual branches in WFM’s experiment laboratory. Compare three hand-coded predictors against a simulated world; these are not trained foundation models."/></head><body><div id="root"></div><noscript><main><h1>World Model Laboratory</h1><p>An interactive, deterministic laboratory for world models: observe a partially observable scene, form a belief from what you have seen, forecast what comes next, plan a route and act — then replay the same moment with a different action. Interface available in English and Turkish. Runs entirely in your browser.</p><p><strong>Scope:</strong> the reference trajectory comes from a physics simulation inside an educational universe. It is not a physical measurement and not a validated model of a real robot. The three predictors are hand-coded educational models, not trained foundation models. Errors are calculated between simulated values; these results do not validate real-world transfer, and counterfactual branches are counterfactual simulation under stated assumptions, not causal identification.</p><h2>What it covers</h2><ul><li>Observation and belief: field of view, occlusion and dead-reckoned memory, with a declared information boundary.</li><li>Prediction: constant velocity, simple dynamics and an intentionally biased dynamics predictor, compared on a frozen common belief.</li><li>Planning and acting: finite search over declared action commands, with an assisted pusher proxy.</li><li>Four scenarios: plan a path, predict motion, see the unseen, meet a surprise; plus World Model 101 and a JSON evidence export.</li></ul></main></noscript><script type="module" src="/src/main.tsx"></script></body></html>
